<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bakerz Bite · Site Map</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ============ SITE MAP SECTION ============ -->
    <section class="site-map" id="sitemap">
        <div class="container">

            <div class="sitemap-header">
                <span class="sitemap-eyebrow">
                    <span class="line"></span>
                    Navigation
                    <span class="line"></span>
                </span>
                <h2>Site Map</h2>
                <p>Quickly find your way around Bakerz Bite</p>
            </div>

            <div class="sitemap-grid">

                <!-- Column 1 — Explore -->
                <div class="sitemap-col">
                    <h3 class="sitemap-title">
                        <i class="fas fa-compass"></i>
                        Explore
                    </h3>
                    <ul class="sitemap-links">
                        <li><a href="project.html#hero"><i class="fas fa-chevron-right"></i> Home</a></li>
                        <li><a href="project.html#products"><i class="fas fa-chevron-right"></i> Products</a></li>
                        <li><a href="project.html#merch"><i class="fas fa-chevron-right"></i> Merchandise</a></li>
                        <li><a href="project.html#gallery"><i class="fas fa-chevron-right"></i> Gallery</a></li>
                    </ul>
                </div>

                <!-- Column 2 — Categories -->
                <div class="sitemap-col">
                    <h3 class="sitemap-title">
                        <i class="fas fa-cake-candles"></i>
                        Categories
                    </h3>
                    <ul class="sitemap-links">
                        <li><a href="project.html#products"><i class="fas fa-chevron-right"></i> Cakes</a></li>
                        <li><a href="project.html#products"><i class="fas fa-chevron-right"></i> Pastries</a></li>
                        <li><a href="project.html#products"><i class="fas fa-chevron-right"></i> Cookies</a></li>
                        <li><a href="project.html#products"><i class="fas fa-chevron-right"></i> Pies</a></li>
                    </ul>
                </div>

                <!-- Column 3 — Discover -->
                <div class="sitemap-col">
                    <h3 class="sitemap-title">
                        <i class="fas fa-star"></i>
                        Discover
                    </h3>
                    <ul class="sitemap-links">
                        <li><a href="project.html#sales"><i class="fas fa-chevron-right"></i> Offers</a></li>
                        <li><a href="project.html#feedback"><i class="fas fa-chevron-right"></i> Feedback</a></li>
                        <li><a href="project.html#faqs"><i class="fas fa-chevron-right"></i> FAQ</a></li>
                        <li><a href="project.html#Contact"><i class="fas fa-chevron-right"></i> Contact Us</a></li>
                    </ul>
                </div>

            </div>

            <!-- Back to Home Button -->
            <div class="sitemap-back">
                <a href="project.html" class="btn-back-home">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Home</span>
                </a>
            </div>

        </div>
    </section>

    <!-- ============ SCRIPTS ============ -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
